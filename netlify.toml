# The published site: the tabletop version as an installable app (index.html, engine.js,
# manifest, service worker, icons). The service worker's cache name is stamped with the commit.
[build]
  command = "rm -rf _site && mkdir _site && cp tabletop.html _site/index.html && cp engine.js handoff.js fts-profile.js manifest.webmanifest _site/ && cp -R icons _site/icons && sed \"s/__BUILD__/${COMMIT_REF:-local}/\" sw.js > _site/sw.js"
  publish = "_site"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
