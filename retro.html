<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nation Builder 8-bit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --k:#000000; --nv:#1d2b53; --pl:#7e2553; --dg:#008751; --br:#ab5236; --dk:#5f574f; --lg:#c2c3c7; --wh:#fff1e8;
  --rd:#ff004d; --or:#ffa300; --yl:#ffec27; --gr:#00e436; --bl:#29adff; --lv:#83769c; --pk:#ff77a8; --pe:#ffccaa;
  --pix:'Press Start 2P', monospace; --vt:'VT323', monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--k);color:var(--wh);}
body{font-family:var(--vt);font-size:24px;line-height:1.15;min-height:100vh;display:flex;justify-content:center;-webkit-font-smoothing:none;}
#app{width:100%;max-width:820px;padding:12px 16px 24px;display:flex;flex-direction:column;gap:10px;}

#hud{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--pix);font-size:9px;letter-spacing:.06em;color:var(--lg);min-height:22px;}
#hud-c{color:var(--yl);}
.hud-btn{font-family:var(--vt);font-size:18px;line-height:1;color:var(--lg);background:none;border:2px solid var(--dk);padding:4px 6px;cursor:pointer;}
.hud-btn:hover{color:var(--wh);border-color:var(--lg);}

#stage{position:relative;width:100%;aspect-ratio:16/9;background:var(--k);border:4px solid var(--wh);box-shadow:0 0 0 4px var(--k),0 0 0 6px var(--dk);overflow:hidden;cursor:pointer;}
#scene{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45) 100%);}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 6%;opacity:0;}
#card.show{animation:card 2.6s steps(8) forwards;}
@keyframes card{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0}}
#card .c1{font-family:var(--pix);font-size:clamp(9px,1.8vw,13px);color:var(--yl);text-shadow:2px 2px 0 var(--k);margin-bottom:12px;letter-spacing:.1em;}
#card .c2{font-family:var(--pix);font-size:clamp(14px,3.6vw,28px);color:var(--wh);text-shadow:3px 3px 0 var(--k),-1px -1px 0 var(--k);line-height:1.4;}

#box{position:relative;background:var(--nv);padding:16px 18px 18px;min-height:210px;
  box-shadow:inset 0 0 0 2px var(--k),inset 0 0 0 4px var(--wh),inset 0 0 0 6px var(--nv),0 0 0 2px var(--k);cursor:pointer;}
#speaker{display:none;align-items:center;gap:12px;margin-bottom:10px;}
#speaker.show{display:flex;}
#portrait{width:72px;height:72px;image-rendering:pixelated;border:2px solid var(--wh);flex-shrink:0;}
#speaker-name{font-family:var(--pix);font-size:9px;line-height:1.8;color:var(--yl);}
#speaker-name small{display:block;color:var(--lg);font-size:8px;}
#title{font-family:var(--pix);font-size:10px;line-height:1.7;color:var(--yl);margin-bottom:10px;}
#title:empty{display:none;}
#title.big{font-family:var(--vt);font-size:32px;line-height:1.1;color:var(--wh);}
#text{white-space:pre-wrap;}
#text:empty{display:none;}
#text.warn{color:var(--pk);}
#text.dim{color:var(--lg);}
#after:empty,#panel:empty{display:none;}
#after{margin-top:12px;}
#after .fam{color:var(--pk);}
#after .echo{color:var(--lv);margin-top:8px;}
#after .echo::before{content:'▸ ';}
#after .dim{color:var(--lg);font-size:20px;}
#after .credit{color:var(--lv);font-size:18px;margin-top:6px;}
#panel{margin-top:4px;}
#menu{list-style:none;margin-top:14px;}
#menu:empty{display:none;}
#menu li{padding:4px 6px 4px 28px;position:relative;cursor:pointer;color:var(--lg);}
#menu li .n{color:var(--lv);margin-right:6px;}
#menu li.on{color:var(--wh);background:rgba(255,241,232,.07);}
#menu li.on::before{content:'▶';position:absolute;left:6px;color:var(--yl);animation:blink .8s steps(2) infinite;}
.press{font-family:var(--pix);font-size:12px;color:var(--yl);text-align:center;padding:28px 0 16px;letter-spacing:.15em;animation:blink 1.1s steps(2) infinite;}
#more{position:absolute;right:18px;bottom:10px;color:var(--yl);display:none;animation:bob .7s steps(2) infinite;}
#more.show{display:block;}
@keyframes blink{50%{opacity:0}}
@keyframes bob{50%{transform:translateY(3px)}}

#foot{display:flex;justify-content:space-between;font-family:var(--pix);font-size:8px;color:var(--dk);gap:8px;}

/* status / ledger */
.ledger{display:grid;gap:8px;}
.lrow{display:grid;grid-template-columns:118px 1fr 190px;gap:10px;align-items:center;}
.lname{font-family:var(--pix);font-size:8px;color:var(--lg);}
.lbar{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;height:12px;}
.lbar i{background:var(--k);}
.lword{font-size:22px;}
.lword b{font-weight:400;font-size:18px;margin-left:6px;}
.up{color:var(--gr);} .down{color:var(--rd);}
.fam-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;}
.fam-row canvas{width:64px;height:64px;image-rendering:pixelated;border:2px solid var(--wh);}
.fam-row div{font-family:var(--pix);font-size:8px;line-height:1.8;color:var(--lg);}
.fam-row b{color:var(--yl);font-weight:400;display:block;}
.record{max-height:46vh;overflow:auto;padding-right:6px;}
.rec{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:5px 0;border-bottom:2px dotted var(--dk);}
.rec .k{font-family:var(--pix);font-size:8px;color:var(--lv);padding-top:5px;}
.rec .v{font-size:22px;}
.rec .v small{display:block;color:var(--yl);font-size:18px;}
.geo{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;}
.geo .k{font-family:var(--pix);font-size:8px;color:var(--lv);padding-top:6px;}

@media(max-width:640px){
  body{font-size:21px;}
  #app{padding:8px 10px 20px;}
  #box{padding:14px 14px 18px;min-height:230px;}
  #title.big{font-size:27px;}
  .lrow{grid-template-columns:1fr 1fr;gap:4px 8px;}
  .lbar{grid-column:1 / -1;order:3;}
  .lword{text-align:right;font-size:20px;}
  .fam-row canvas{width:52px;height:52px;}
  .rec{grid-template-columns:1fr;gap:0;}
  .geo{grid-template-columns:1fr;}
  #foot .keys{display:none;}
}
</style>
</head>
<body>
<div id="app">
  <div id="hud"><span id="hud-l">NATION BUILDER</span><span id="hud-c"></span><span><button class="hud-btn" id="btn-restart" title="Start over">↺</button> <button class="hud-btn" id="btn-sound">♪ ON</button></span></div>
  <div id="stage"><canvas id="scene" width="192" height="108"></canvas><div id="card"><div class="c1"></div><div class="c2"></div></div></div>
  <div id="box">
    <div id="speaker"><canvas id="portrait" width="24" height="24"></canvas><div id="speaker-name"></div></div>
    <div id="title"></div>
    <div id="text"></div>
    <div id="after"></div>
    <div id="panel"></div>
    <ul id="menu"></ul>
    <div id="more">▼</div>
  </div>
  <div id="foot"><span id="page">PAGE 1</span><span class="keys">↑↓ / 1-4 CHOOSE · ENTER / TAP CONTINUE</span></div>
</div>

<script src="engine.js"></script>
<script>
let state = null;
const $ = id => document.getElementById(id);

// ═══════════════════════════════════════════════════════════
// PALETTE (PICO-8) + PIXEL PRIMITIVES — scene is 192×108
// ═══════════════════════════════════════════════════════════
const P = {k:'#000000',nv:'#1d2b53',pl:'#7e2553',dg:'#008751',br:'#ab5236',dk:'#5f574f',lg:'#c2c3c7',wh:'#fff1e8',
           rd:'#ff004d',or:'#ffa300',yl:'#ffec27',gr:'#00e436',bl:'#29adff',lv:'#83769c',pk:'#ff77a8',pe:'#ffccaa'};
const W=192, Hh=108;
const cv=$('scene'); let g=cv.getContext('2d');
function R(x,y,w,h,c){ g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),w,h); }
function PX(x,y,c){ R(x,y,1,1,c); }
function circle(cx,cy,r,c){ for(let y=-r;y<=r;y++){ const w=Math.floor(Math.sqrt(r*r-y*y)); R(cx-w,cy+y,2*w+1,1,c); } }
function dither(x,y,w,h,c){ for(let j=0;j<h;j++) for(let i=(j%2);i<w;i+=2) PX(x+i,y+j,c); }
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

const SKIES = {
  day:[P.bl,P.bl,P.bl,P.lg], dusk:[P.nv,P.pl,P.rd,P.or], night:[P.k,P.k,P.nv,P.nv],
  dry:[P.or,P.or,P.yl,P.pe], storm:[P.k,P.dk,P.dk,P.lv], sick:[P.k,P.nv,P.nv,P.dg], sunset:[P.nv,P.pl,P.rd,P.or,P.yl]
};
function sky(name, yEnd){
  const cs=SKIES[name], bh=yEnd/cs.length;
  cs.forEach((c,i)=>R(0,i*bh,W,bh+1,c));
  for(let i=1;i<cs.length;i++) dither(0,Math.round(i*bh)-1,W,2,cs[i]);
}
function stars(f,n,seed,maxY){ const r=rng(seed); for(let i=0;i<n;i++){ const x=r()*W|0, y=r()*maxY|0; PX(x,y,(f+i)%17===0?P.yl:(i%3?P.lg:P.wh)); } }
function hills(y,amp,freq,ph,c){ for(let x=0;x<W;x++){ const h=Math.round(y+Math.sin(x*freq+ph)*amp+Math.sin(x*freq*2.3+ph*1.7)*amp*.4); R(x,h,1,Hh-h,c); } }
function house(x,y,w,h,wall,roof,o={}){
  R(x,y,w,h,wall); const rh=Math.ceil(w/2);
  for(let r=0;r<rh;r++){ R(x-1+r,y-r-1,w+2-2*r,1,roof); }
  if(o.door!==false) R(x+Math.floor(w/2)-1,y+h-4,3,4,o.doorC||P.br);
  if(o.win) { R(x+2,y+2,2,2,o.win); if(w>9) R(x+w-4,y+2,2,2,o.win); }
}
function tree(x,y,c=P.dg,c2=P.gr){ R(x,y,2,6,P.br); circle(x+1,y-2,4,c); PX(x,y-4,c2); PX(x+2,y-3,c2); }
function deadTree(x,y){ R(x,y-12,2,14,P.br); R(x-4,y-9,4,1,P.br); R(x-5,y-11,1,2,P.br); R(x+2,y-7,4,1,P.br); R(x+5,y-9,1,2,P.br); }
function water(y,f,c1=P.nv,c2=P.bl){ R(0,y,W,Hh-y,c1); for(let j=y+2;j<Hh;j+=4) for(let x=-8;x<W;x+=12) R(x+((f*2+j*3)%12),j,4,1,c2); }
function fire(x,y,f){ const r=rng(f*31+x); for(let i=0;i<6;i++){ const dx=(r()*5|0)-2, dy=-(r()*6|0); PX(x+dx,y+dy,[P.rd,P.or,P.yl][i%3]); } PX(x,y,P.yl); }
function smoke(x,y,f,c=P.dk){ for(let i=0;i<5;i++){ const t=(f+i*6)%30; circle(x+Math.round(Math.sin((t+i)/4)*2)+t/4, y-t, 1+Math.floor(t/10), c); } }
function rain(f,c=P.lv){ const r=rng(7); for(let i=0;i<60;i++){ const x=(r()*W+f*3)%W|0, y=(r()*Hh+f*7)%Hh|0; R(x,y,1,3,c); } }
function flagpole(x,y,f,c=P.rd){ R(x,y,1,16,P.lg); for(let i=0;i<8;i++){ const wv=Math.round(Math.sin((f+i)/2)); R(x+1+i,y+wv,1,5,c); } PX(x+4,y+2+Math.round(Math.sin((f+3)/2)),P.yl); }
function person(x,y,o={}){
  const s=o.skin||P.pe, sh=o.shirt||P.bl, hr=o.hair||P.br, pa=o.pants||P.nv, f=o.f||0;
  const b = o.bob!=null ? (((f+o.bob)%6)<3?0:1) : 0; y-=b;
  const sm = o.small?2:0;
  R(x+1,y+1,3,3,s); R(x+1,y,3,1,hr); PX(x+1,y+1,hr); if(o.long) { R(x,y+1,1,4,hr); R(x+4,y+1,1,4,hr); }
  R(x,y+4,5,4-sm/2,sh); PX(x,y+7-sm/2,s); PX(x+4,y+7-sm/2,s);
  R(x+1,y+8-sm/2,1,3-sm/2,pa); R(x+3,y+8-sm/2,1,3-sm/2,pa);
  if(o.hat) R(x,y,5,1,o.hat);
  if(o.item==="rifle"){ R(x+5,y+1,1,8,P.dk); PX(x+5,y,P.lg); }
  if(o.item==="torch"){ R(x+5,y+3,1,6,P.br); fire(x+5,y+2,f+x); }
  if(o.item==="sign"){ R(x+5,y-2,1,9,P.br); R(x+2,y-7,8,5,P.wh); R(x+3,y-5,6,1,P.dk); }
}
const SHIRTS=[P.rd,P.bl,P.or,P.lv,P.dg,P.br,P.pk,P.lg], HAIRS=[P.br,P.k,P.dk,P.or,P.k,P.br];
function crowd(x0,x1,y,n,seed,o={}){ const r=rng(seed); for(let i=0;i<n;i++){ const x=x0+(x1-x0)*i/n+r()*3; person(x,y+(r()*3|0),{...o,shirt:SHIRTS[r()*8|0],hair:HAIRS[r()*6|0],bob:o.bob?i:null,item:o.items?o.items(i,r):o.item}); } }

// ═══════════════════════════════════════════════════════════
// SCENES — each returns a draw(frame) closure
// ═══════════════════════════════════════════════════════════
const SC = {
  title:()=>f=>{
    sky("night",82); stars(f,50,3,64); circle(156,18,8,P.wh); circle(160,15,7,P.k);
    hills(66,5,.045,1,P.dk); dither(0,62,W,10,P.nv); hills(84,4,.07,2.4,P.k); circle(96,88,14,P.k);
    flagpole(95,60,f);
    [[30,86],[48,88],[130,87],[150,85],[170,88]].forEach(([x,y],i)=>{ house(x,y,9,7,P.lv,P.pl,{door:false}); PX(x+3,y+3,(f+i*5)%40<36?P.yl:P.or); });
  },
  geo:(icon)=>f=>{
    if(icon==="coastal"){ sky("day",60); circle(30,16,7,P.yl); water(60,f); R(0,56,96,52,P.dg); for(let x=0;x<96;x++) R(x,56+Math.round(Math.sin(x/9)*2),1,2,P.gr);
      R(90,58,8,50,P.lg); house(20,48,12,8,P.wh,P.rd,{win:P.bl}); house(40,50,9,6,P.pe,P.br); house(60,47,10,9,P.lg,P.rd,{win:P.bl}); tree(8,52); tree(80,51);
      const sy=72+((f>>2)%2); R(130,sy,26,4,P.br); R(142,sy-16,1,16,P.dk); R(136,sy-14,6,10,P.wh); R(143,sy-12,6,8,P.wh); }
    else if(icon==="landlocked"){ sky("day",50); hills(40,6,.05,0,P.lv); hills(52,5,.08,1,P.dg); R(0,70,W,38,P.dg);
      for(let x=0;x<W;x++) R(x,78+Math.round(Math.sin(x/14)*5),1,5,P.bl); const r=rng(9); for(let i=0;i<26;i++) tree(r()*W|0, 58+(r()*44|0), P.dg, P.gr);
      house(96,66,10,7,P.wh,P.br,{win:P.yl}); }
    else if(icon==="arid"){ sky("dry",60); circle(150,22,12,P.yl); R(0,60,W,48,P.or); [[10,40,34],[60,46,22],[120,38,40]].forEach(([x,y,w])=>{ R(x,y,w,22,P.br); R(x,y,w,2,P.pe); });
      for(let x=0;x<W;x++) R(x,84+Math.round(Math.sin(x/18)*3),1,4,P.bl); dither(0,60,W,4,P.pe); }
    else if(icon==="island"){ sky("day",48); water(48,f); circle(96,92,44,P.dg); R(0,92,W,16,P.nv); water(92,f);
      R(86,40,20,14,P.dk); R(90,36,12,4,P.dk); smoke(96,34,f,P.lg); tree(70,60,P.dg,P.gr); tree(124,62,P.dg,P.gr); dither(52,82,88,4,P.pe); }
    else { sky("day",54); circle(40,20,8,P.yl); R(0,54,W,54,P.yl); for(let j=58;j<Hh;j+=4) R(0,j,W,1,P.or); for(let x=0;x<W;x++) R(x,70+Math.round(Math.sin(x/20)*3),1,4,P.bl);
      house(140,48,10,6,P.wh,P.rd,{win:P.bl}); R(152,40,3,14,P.lg); circle(153,40,3,P.lg); }
  },
  home:(time="day")=>f=>{
    sky(time,62); if(time!=="day") stars(f,20,5,30); else circle(160,16,7,P.yl);
    hills(54,4,.05,1,time==="day"?P.lv:P.nv); R(0,70,W,38,time==="day"?P.dg:P.nv);
    house(70,52,22,18,P.pe,P.br,{win:time==="day"?P.bl:P.yl}); R(40,74,30,1,P.br); for(let x=40;x<70;x+=5) R(x,71,1,5,P.br);
    smoke(84,30,f,P.lg); tree(30,64); tree(140,62);
    const fam=state&&state.family; if(fam){ const cs=FAMSHIRT; ["F","M","S","D"].forEach((r,i)=>person(104+i*9,78+(r==="D"?2:0),{shirt:cs[r],hair:famHair(),long:r==="M"||r==="D",small:r==="D",bob:i,f})); }
  },
  council:(o={})=>f=>{
    R(0,0,W,Hh,P.lv); R(0,72,W,36,P.br); dither(0,72,W,2,P.dk);
    for(let x=10;x<W;x+=36){ R(x,6,10,66,P.lg); R(x+8,6,2,66,P.dk); R(x-2,4,14,4,P.wh); R(x-2,70,14,3,P.wh); }
    for(let x=28;x<W;x+=36){ R(x,12,8,14,P.nv); dither(x,12,8,14,P.bl); }
    if(o.empty){ R(86,30,20,40,P.pl); R(84,28,24,4,P.yl); R(90,50,12,4,P.rd); R(80,70,32,3,P.k);
      person(30,62,{shirt:P.k,bob:0,f}); person(150,62,{shirt:P.dk,item:"rifle",bob:1,f}); person(160,63,{shirt:P.pl,bob:2,f}); }
    else if(o.judge){ R(66,40,60,32,P.br); R(66,40,60,3,P.or); person(93,30,{shirt:P.k,hair:P.lg,f}); R(0,0,W,4,P.pl); crowd(10,60,64,5,4,{bob:1,f}); crowd(134,186,64,5,5,{bob:1,f}); }
    else { R(86,8,20,26,P.rd); R(92,14,8,8,P.yl); crowd(30,170,56,12,o.seed||2,{bob:1,f}); R(20,64,152,8,P.br); R(20,64,152,2,P.or); R(24,72,2,8,P.k); R(166,72,2,8,P.k);
      if(o.scroll){ R(80,61,30,4,P.wh); R(80,61,2,4,P.pe); } }
  },
  fields:(o={})=>f=>{
    sky("day",50); circle(28,14,7,P.yl); hills(46,3,.06,2,P.lv);
    for(let j=50;j<Hh;j+=3) R(0,j,W,2,j%6?P.dg:P.gr);
    house(146,38,16,12,P.wh,P.rd,{win:P.bl}); for(let x=100;x<190;x+=6) R(x,52,1,6,P.br); R(100,53,90,1,P.br);
    if(o.workers) crowd(20,110,72,7,11,{bob:1,f,hat:P.yl}); else person(60,60,{shirt:P.dg,hat:P.yl,bob:0,f});
    if(o.stakes){ for(let x=14;x<190;x+=22){ R(x,62,1,10,P.wh); PX(x,61,P.rd); } for(let x=14;x<180;x+=2) PX(x,64+((x/2)%2),P.lg);
      [120,132,170].forEach((x,i)=>person(x,74,{shirt:P.k,hat:P.k,item:"rifle",bob:i,f})); }
  },
  church:()=>f=>{

function ensureCtx(){
  if(!SND.ctx){ try{ SND.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(SND.ctx.state==='suspended') SND.ctx.resume().then(startMusic);

    gn.gain.setValueAtTime(v,t); gn.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(gn).connect(c.destination); o.start(t); o.stop(t+d+.02); }catch(e){}
}

// MUSIC — a tiny step sequencer: pulse-wave lead, triangle bass,
// noise drums. One step = a sixteenth note; songs loop.
// ═══════════════════════════════════════════════════════════
const NOTE={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
const midi = n => { const m=n.match(/^([A-G]#?)(\d)$/); return NOTE[m[1]]+(+m[2]+1)*12; };
const hz = m => 440*Math.pow(2,(m-69)/12);
// [note, length-in-steps] list → timed events; '-' is a rest
function seq(list){ const ev=[]; let s=0; list.forEach(([n,d])=>{ if(n!=='-') ev.push({s,m:midi(n),d}); s+=d; }); return ev; }
// root–fifth–octave–fifth eighth notes, one root per half bar
function bassLine(roots){ const ev=[]; roots.forEach((r,i)=>{ const m=midi(r); [0,7,12,7].forEach((o,k)=>ev.push({s:i*8+k*2,m:m+o,d:2})); }); return ev; }
function drums(bars){ const ev=[]; for(let b=0;b<bars;b++) for(let s=0;s<16;s+=2) ev.push({s:b*16+s, kit:s%8===0?'kick':s%8===4?'snare':'hat', d:1}); return ev; }
function arps(chords){ const ev=[]; chords.forEach((c,b)=>{ const ms=c.map(midi); [0,1,2,1,0,1,2,1].forEach((k,i)=>ev.push({s:b*16+i*2,m:ms[k]+12,d:2})); }); return ev; }

function pulseWave(c,duty){
  if(MUS.waves[duty]) return MUS.waves[duty];

}
function noiseBuf(c){

  const b=c.createBuffer(1,c.sampleRate*.3,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;

}

  if(tr.wave==='triangle') o.type='triangle'; else o.setPeriodicWave(pulseWave(c,tr.wave));
  o.frequency.setValueAtTime(hz(e.m),t);
  gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(tr.vol,t+.006);
  gn.gain.setValueAtTime(tr.vol*.75,t+Math.min(.08,dur*.4)); gn.gain.linearRampToValueAtTime(0,t+dur*.92);
  o.connect(gn).connect(dest); o.start(t); o.stop(t+dur);
}
function schedule(){
  const c=SND.ctx, song=SONGS[MUS.cur]; if(!c||!song) return;
  const sd=60/song.bpm/4;
  while(MUS.next < c.currentTime+.2){
    MUS.buckets[MUS.step%song.len].forEach(([tr,e])=>playNote(c,tr,e,MUS.next,sd));
    MUS.step++; MUS.next+=sd;
  }
}
function startMusic(){
  const c=SND.ctx;
  if(!SND.on||!MUS.want||MUS.cur||!c||c.state!=='running'||document.hidden) return;
  const song=SONGS[MUS.want];
  MUS.buckets=Array.from({length:song.len},()=>[]);
  song.tracks.forEach(tr=>tr.ev.forEach(e=>MUS.buckets[e.s].push([tr,e])));
  MUS.cur=MUS.want; MUS.node=c.createGain(); MUS.node.gain.value=1; MUS.node.connect(c.destination);
  MUS.step=0; MUS.next=c.currentTime+.08;
  schedule(); MUS.timer=setInterval(schedule,25);
}
function stopMusic(){
  if(!MUS.cur) return;
  clearInterval(MUS.timer); MUS.cur=null;
  const n=MUS.node, c=SND.ctx; n.gain.setTargetAtTime(0,c.currentTime,.15); setTimeout(()=>n.disconnect(),1200);
}
function music(name){ if(MUS.want===name&&MUS.cur===name) return; MUS.want=name; stopMusic(); startMusic(); }
['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,()=>{ const c=ensureCtx(); if(c&&c.state==='running') startMusic(); },true));
document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopMusic(); else startMusic(); });

function setSound(on){
  SND.on=on; $('btn-sound').textContent=on?'♪ ON':'♪ OFF';
  try{ localStorage.setItem('nb-sound',on?'on':'off'); }catch(e){}
  if(on) startMusic(); else stopMusic();
}
$('btn-sound').onclick=e=>{ e.stopPropagation(); setSound(!SND.on); e.currentTarget.blur(); };
$('btn-sound').textContent=SND.on?'♪ ON':'♪ OFF';
$('btn-restart').onclick=e=>{ e.stopPropagation(); e.currentTarget.blur(); main(); };

// ═══════════════════════════════════════════════════════════
// DIALOG ENGINE — page() types text, then waits or offers a menu
// ═══════════════════════════════════════════════════════════
const ui={mode:null,timer:null,finish:null,resolve:null,idx:0,opts:[],pageNo:0};
function hud(l,c){ $('hud-l').textContent=l; $('hud-c').textContent=c||''; }
function card(c1,c2){ const el=$('card'); el.querySelector('.c1').textContent=c1; el.querySelector('.c2').textContent=c2; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
function setSpeaker(sp){
  const el=$('speaker');
  if(!sp){ el.classList.remove('show'); return; }
  const r=sp.r||sp, dead=!!sp.dead, m=state.family.members[ROLE_IDX[r]], age=ageAt(r,state.year);
  drawPortrait($('portrait'), r, age, dead);
  $('speaker-name').innerHTML=`${m.name.toUpperCase()} ${state.family.surname.toUpperCase()}<small>${dead?'IN MEMORY':m.role.split(' — ')[0].toUpperCase()+' · '+age}</small>`;
  el.classList.add('show');
}
function page({title='',big=false,text='',speaker=null,after='',panel='',options=null,tone=''}={}){
  clearInterval(ui.timer);
  return new Promise(res=>{
    ui.pageNo++; $('page').textContent='PAGE '+ui.pageNo;
    setSpeaker(speaker);
    $('title').textContent=title; $('title').className=big?'big':'';
    const tx=$('text'); tx.className=tone; tx.textContent='';
    $('after').innerHTML=''; $('panel').innerHTML=''; $('menu').innerHTML=''; $('more').classList.remove('show');
    const full=text; let n=0;
    const done=()=>{
      clearInterval(ui.timer); tx.textContent=full; $('after').innerHTML=after; $('panel').innerHTML=panel;
      if(options){ ui.mode='menu'; renderMenu(options,res); }
      else { ui.mode='wait'; ui.resolve=res; $('more').classList.add('show'); }
    };
    ui.finish=done;
    if(!full){ done(); return; }
    ui.mode='type';
    ui.timer=setInterval(()=>{
      const ch=full[n]; n+=2; tx.textContent=full.slice(0,n);
      if(n%4===0&&ch&&ch.trim()) sfx.blip();
      if(n>=full.length) done();
    }, 28);
  });
}
function renderMenu(options,res){
  ui.opts=options; ui.idx=0; ui.pick=i=>{ if(ui.mode!=='menu') return; ui.mode=null; sfx.pick(); res(i); };
  $('menu').innerHTML=options.map((o,i)=>`<li data-i="${i}"><span class="n">${i+1}.</span>${o}</li>`).join('');
  $('menu').querySelectorAll('li').forEach(li=>{
    const i=+li.dataset.i;
    li.onmouseenter=()=>setIdx(i);
    li.onclick=e=>{ e.stopPropagation(); ui.pick(i); };
  });
  setIdx(0,true);
}
function setIdx(i,silent){ if(i<0||i>=ui.opts.length) return; if(i!==ui.idx&&!silent) sfx.move(); ui.idx=i; $('menu').querySelectorAll('li').forEach((li,j)=>li.classList.toggle('on',j===i)); }
function advance(){
  if(ui.mode==='type') ui.finish();
  else if(ui.mode==='wait'){ ui.mode=null; $('more').classList.remove('show'); sfx.next(); ui.resolve(); }
}
$('box').addEventListener('click',advance);
$('stage').addEventListener('click',advance);
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(ui.mode==='menu'){
    if(k==='ArrowDown'||k==='s'){ e.preventDefault(); setIdx((ui.idx+1)%ui.opts.length); }
    else if(k==='ArrowUp'||k==='w'){ e.preventDefault(); setIdx((ui.idx-1+ui.opts.length)%ui.opts.length); }
    else if(k==='Enter'||k===' '||k==='z'){ e.preventDefault(); ui.pick(ui.idx); }
    else if(/^[1-9]$/.test(k)&&+k<=ui.opts.length){ e.preventDefault(); setIdx(+k-1,true); ui.pick(+k-1); }
  } else if(k==='Enter'||k===' '||k==='z'||k==='ArrowRight'){ e.preventDefault(); advance(); }
});

// text helpers
const strip = h => h.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&');
const paras = html => html.split(/<\/?p>/).map(strip).map(s=>s.trim()).filter(Boolean);
function chunk(text,max=260){
  const parts=text.match(/[^.!?]+[.!?]+["”’']?\s*|[^.!?]+$/g)||[text], out=[]; let cur='';
  parts.forEach(p=>{ if((cur+p).length>max&&cur){ out.push(cur.trim()); cur=''; } cur+=p; });
  if(cur.trim()) out.push(cur.trim()); return out;
}
async function sayLong(text,opts={}){ const cs=chunk(text); for(let i=0;i<cs.length;i++) await page({...opts,title:i===0?opts.title:'',big:i===0&&opts.big,text:cs[i]}); }
function speakerFor(raw){ const m=raw.match(/\{([FMSD])\}/); return m?m[1]:null; }

function ledger(prev){
  return `<div class="ledger">${METERS.map(mt=>{
    const v=state.m[mt.k], d=prev?v-prev[mt.k]:0, n=Math.round(v/5), col=v<35?P.rd:v<50?P.or:v<65?P.yl:P.gr;
    return `<div class="lrow"><div class="lname">${mt.n.toUpperCase()}</div><div class="lbar">${Array.from({length:20},(_,i)=>`<i style="${i<n?'background:'+col:''}"></i>`).join('')}</div><div class="lword">${word(mt,v)}${d?`<b class="${d>0?'up':'down'}">${d>0?'▲':'▼'}${Math.abs(d)}</b>`:''}</div></div>`;
  }).join('')}</div>`;
}
function famRow(year){
  return `<div class="fam-row">${["F","M","S","D"].map(r=>`<div><canvas width="24" height="24" data-r="${r}" data-age="${ageAt(r,year)}"></canvas><b>${first(r).toUpperCase()}</b>${ageAt(r,year)}</div>`).join('')}</div>`;
}
function paintFamRow(){ document.querySelectorAll('.fam-row canvas').forEach(c=>drawPortrait(c,c.dataset.r,+c.dataset.age,false)); }

// ═══════════════════════════════════════════════════════════
// THE ADVENTURE
// ═══════════════════════════════════════════════════════════
let RUN=0;
async function main(){
  const run=++RUN; const alive=()=>run===RUN;
  ui.pageNo=0; state=null;
  hud('NATION BUILDER',''); setScene(SC.title()); card('A CHOOSE-YOUR-FOUNDING ADVENTURE','NATION BUILDER');
  music('title');
  await page({title:'NATION BUILDER',big:true,panel:'<div class="press">PRESS START</div>'});
  if(!alive()) return;
  await page({title:'NATION BUILDER',big:true,text:'Independence has been won. The old order is gone.\nWho holds power, how people eat, how disputes are settled — all of it is now yours to decide.\n\nYou will follow one family across fifty years.',options:['BEGIN THE FOUNDING']});
  if(!alive()) return; music(null); sfx.fanfare();

  // ── the nation and the family ──
  state=newState(rnd(NATIONS), rnd(FAMILIES));
  const N=state.nation, FAM=state.family, NU=N.name.toUpperCase();
  hud(NU,'YEAR 1'); setScene(SC.geo(N.icon)); card('YOUR NATION',NU);
  await page({title:NU,big:true,text:N.desc+'.',panel:`<div class="geo">${Object.entries(N.geo).map(([k,v])=>`<div class="k">${k.toUpperCase()}</div><div>${v}</div>`).join('')}</div>`});
  if(!alive()) return;
  setScene(SC.home('day')); card('THE FAMILY',`THE ${FAM.surname.toUpperCase()}S`);
  for(const r of ["F","M","S","D"]){ await page({speaker:r,text:FAM.members[ROLE_IDX[r]].desc}); if(!alive()) return; }
  await page({text:'You are among the founders. Ten questions will set the shape of the nation. Fifty years will test it.\n\nThe '+FAM.surname+' family will live inside every choice you make.'});
  if(!alive()) return;

  // ── the founding ──
  for(let qi=0; qi<QUESTIONS.length; qi++){
    const q=QUESTIONS[qi]; state.qi=qi;
    hud(NU,`THE FOUNDING ${qi+1}/10`); setScene(questionScene(q)); card(`CHAPTER ${qi+1}`,q.cat.toUpperCase());
    await page({title:q.title,big:true,text:T(q.ctx)}); if(!alive()) return;
    const tag=N.tags.find(t=>q.geo&&q.geo[t]);
    if(tag){ await page({title:'IN '+NU,text:T(q.geo[tag])}); if(!alive()) return; }
    await page({speaker:q.witness.r,text:'"'+T(q.witness.q)+'"'}); if(!alive()) return;
    while(true){
      const i=await page({title:q.title,options:q.choices.map(c=>T(c.l))}); if(!alive()) return;
      const c=q.choices[i];
      const j=await page({title:T(c.l).toUpperCase(),text:T(c.c),after:`<div class="fam">${T(c.fi)}</div><div class="echo">${T(c.x)}</div>`,options:['SO BE IT','RECONSIDER']});
      if(!alive()) return;
      if(j===0){ state.answers[qi]=i; break; }
    }
  }

  // ── ratification ──
  ratifyState();
  hud(NU,'YEAR 1'); setScene(SC.title()); card('YEAR ONE','THE FOUNDING IS RATIFIED'); sfx.fanfare();
  await sayLong(foundingSentence(),{title:'WHAT YOU HAVE MADE'}); if(!alive()) return;
  await page({title:'STATE OF THE NATION',panel:ledger(null)}); if(!alive()) return;
  const faults=activeFaults().slice(0,5);
  for(let i=0;i<faults.length;i++){ sfx.low(); await page({title:`FAULT LINE ${i+1} OF ${faults.length}`,text:faults[i],tone:'warn'}); if(!alive()) return; }
  if(!faults.length){ await page({title:'FAULT LINES',text:'No contradiction leaps off the page. That does not mean there are none — only that they will have to be found the hard way.'}); if(!alive()) return; }

  // ── the eras ──
  for(const era of [2,3]){
    state.era=era; state.queue=pickCrises(era);
    for(let ci=0; ci<state.queue.length; ci++){
      const cr=state.queue[ci], h=H(); state.ci=ci; state.used.add(cr.id); state.year=cr.year;
      hud(NU,`YEAR ${cr.year}`); setScene(crisisScene(cr)); card(`YEAR ${cr.year} · ${cr.type.toUpperCase()}`,cr.title.toUpperCase()); sfx.sting();
      const ps=paras(T(cr.story(h)));
      for(let pi=0;pi<ps.length;pi++){ await sayLong(ps[pi],{title:pi===0?cr.title:'',big:pi===0}); if(!alive()) return; }
      const v=cr.voice&&cr.voice(h);
      if(v){ await page({speaker:v.r,text:'"'+T(v.q)+'"'}); if(!alive()) return; }
      let i;
      while(true){
        i=await page({title:`HOW DOES ${NU} RESPOND?`,after:`<div class="dim">${T(cr.cause(h))}</div><div class="credit">${cr.insp}</div>`,options:cr.choices.map(c=>T(c.l))}); if(!alive()) return;
        const j=await page({title:T(cr.choices[i].l).toUpperCase(),text:T(cr.choices[i].c),options:['DECIDE','RECONSIDER']}); if(!alive()) return;
        if(j===0) break;
      }
      const c=applyCrisisChoice(cr,i);
      await sayLong(T(c.after),{title:'WHAT HAPPENED'}); if(!alive()) return;
      const sp=speakerFor(c.fam);
      await page({speaker:sp,title:sp?'':`THE ${FAM.surname.toUpperCase()} FAMILY`,text:T(c.fam),tone:'warn'}); if(!alive()) return;
    }
    if(era===2){
      state.year=25; state.snapshots[25]={...state.m};
      hud(NU,'YEAR 25'); setScene(SC.home('dusk')); card('YEAR 25','A GENERATION IN');
      await page({title:'A GENERATION IN',big:true,text:'The founders are old men now, or gone. The children who were small at the founding are grown, with opinions of their own about what was decided on their behalf.'}); if(!alive()) return;
      await page({title:'STATE OF THE NATION · SINCE YEAR ONE',panel:ledger(state.snapshots[1])}); if(!alive()) return;
      const fp=page({title:`THE ${FAM.surname.toUpperCase()} FAMILY`,panel:famRow(25)}); paintFamRow(); await fp; if(!alive()) return;
      for(const r of ["F","M","S","D"]){ await page({speaker:r,text:T(vignette(r))}); if(!alive()) return; }
    }
  }

  // ── fifty years on ──
  state.year=50;
  const v=verdict();
  hud(NU,'YEAR 50'); setScene(SC.hilltop()); card('YEAR 50','FIFTY YEARS ON'); music('ending');
  await sayLong(v.p,{title:v.t,big:true}); if(!alive()) return;
  for(const r of ["F","M","S","D"]){
    const dead=r==="F"||r==="M";
    await sayLong(T(fate(r)),{speaker:{r,dead}}); if(!alive()) return;
  }
  await page({title:'STATE OF THE NATION · YEAR ONE TO YEAR 50',panel:ledger(state.snapshots[1])}); if(!alive()) return;
  while(true){
    const k=await page({title:'IS THIS THE NATION YOU MEANT TO MAKE?',big:true,options:['BUILD ANOTHER NATION','READ THE RECORD']}); if(!alive()) return;
    if(k===0) return main();
    await page({title:`THE RECORD · ${NU} · THE ${FAM.surname.toUpperCase()}S`,panel:`<div class="record">${state.log.map(e=>`<div class="rec"><div class="k">${e.k.toUpperCase()}</div><div class="v">${e.t?`<small>${e.t}</small>`:''}${e.v}</div></div>`).join('')}</div>`});
    if(!alive()) return;
  }
}
main();
</script>
